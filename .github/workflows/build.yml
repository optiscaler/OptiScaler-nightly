name: Scheduled Nightly Build

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

env:
  SOLUTION_FILE_PATH: .
  MAIN_REPO: 'optiscaler/OptiScaler'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Main Repository
        uses: actions/checkout@v6
        with:
          repository: ${{ env.MAIN_REPO }}
          fetch-depth: 0
          submodules: 'true'

      - name: Extract OptiScaler Version
        id: get_version
        shell: powershell
        run: |
          $resourceFile = ".\OptiScaler\resource.h"
          if (-Not (Test-Path $resourceFile)) { Write-Error "File not found: $resourceFile"; exit 1 }

          function Get-Version-Component([string]$name) {
              $line = Get-Content $resourceFile | Select-String -Pattern "#define $name\s+" | Select-Object -First 1
              if (-not $line) { Write-Error "Pattern not found: $name"; exit 1 }
              return ($line.Line -replace "#define $name\s+").Trim()
          }

          $version = "v$(Get-Version-Component VER_MAJOR_VERSION).$(Get-Version-Component VER_MINOR_VERSION).$(Get-Version-Component VER_HOTFIX_VERSION)-pre$(Get-Version-Component VER_BUILD_NUMBER)"
          $date = Get-Date -Format "yyyyMMdd"
          $sha = (git rev-parse --short=8 HEAD).Trim()

          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "filename=OptiScaler_${version}_${date}_${sha}" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "release_tag=nightly-${date}" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v3

      - name: Build ReleaseDebug
        run: msbuild /m /p:Configuration=ReleaseDebug ${{ env.SOLUTION_FILE_PATH }} /verbosity:minimal

      # 1. Raw ReleaseDebug output (DLL + PDB) for crash dump analysis, taken before a\ exists
      - name: Compress ReleaseDebug Output
        shell: powershell
        run: |
          $rd = "${{ github.workspace }}\x64\ReleaseDebug"
          if (-not (Test-Path "$rd\OptiScaler.pdb")) { Write-Error "Missing $rd\OptiScaler.pdb"; exit 1 }
          # Skip the OptiScaler_*.7z files the ReleaseDebug post-build drops here, they duplicate the DLL/PDB
          7z a "${{ github.workspace }}\${{ steps.get_version.outputs.filename }}_ReleaseDebug.7z" "$rd\*" '-x!*.7z'
          if ($LASTEXITCODE -gt 1) { exit $LASTEXITCODE }
          exit 0

      - name: Upload ReleaseDebug Artifact
        uses: actions/upload-artifact@v7.0.0
        with:
          name: ${{ steps.get_version.outputs.filename }}_ReleaseDebug
          path: ${{ github.workspace }}\${{ steps.get_version.outputs.filename }}_ReleaseDebug.7z
          archive: false
          compression-level: 0
          if-no-files-found: error

      # 2-4. Same layout as the Release post-build event in OptiScaler.vcxproj; keep the two in sync
      - name: Create Release Package
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $ws = "${{ github.workspace }}"
          $ext = "$ws\external"
          $a = "$ws\x64\ReleaseDebug\a"
          $opti = "$a\OptiScaler"
          $lic = "$a\Licenses"
          $agility = "$opti\D3D12_OptiScaler"
          $plugins = "$opti\plugins"
          $ffx2 = "$ext\FidelityFX-SDK-v2\Kits\FidelityFX\signedbin"

          New-Item -ItemType Directory -Force $a, $opti, $lic, $agility, $plugins | Out-Null

          Copy-Item "$ws\x64\ReleaseDebug\OptiScaler.dll" $a
          Copy-Item "$ext\xess\LICENSE.txt" "$lic\XeSS_LICENSE.txt"
          Copy-Item "$ext\xess\bin\*.dll" $opti
          # Post-build targets a\OptiScaler\Licenses, which it never creates, so the copy fails there; a\Licenses is the intent
          Copy-Item "$ext\FidelityFX-SDK\docs\license.md" "$lic\FidelityFX_v1_LICENSE.md"
          Copy-Item "$ffx2\amd_fidelityfx_loader_dx12.dll" $opti
          Copy-Item "$ffx2\amd_fidelityfx_upscaler_dx12.dll" $opti
          Copy-Item "$ffx2\amd_fidelityfx_framegeneration_dx12.dll" $opti
          Copy-Item "$ffx2\amd_fidelityfx_loader_vk.dll" $opti
          Copy-Item "$ffx2\amd_fidelityfx_upscaler_vk.dll" $opti
          Copy-Item "$ffx2\amd_fidelityfx_framegeneration_vk.dll" $opti
          Copy-Item "$ext\FidelityFX-SDK-v2\docs\license.md" "$lic\FidelityFX_v2_LICENSE.md"
          Copy-Item "$ws\OptiScaler.ini", "$ws\setup_windows.bat", "$ws\setup_linux.sh" $a
          Copy-Item "$ext\directx_agility_sdk\lib\*.dll" $agility
          Copy-Item "$ext\directx_agility_sdk\LICENSE.txt" "$lic\DirectX_LICENSE.txt"
          New-Item -ItemType File "$a\!! EXTRACT ALL FILES TO GAME FOLDER !!" | Out-Null

          # Streamlined fetcher goes next to the upscaler DLLs
          if (-not (Test-Path "$ws\Streamlined_fetcher_windows.bat")) { Write-Error "Streamlined_fetcher_windows.bat not found" }
          Copy-Item "$ws\Streamlined_fetcher_windows.bat" $opti -Force

          # Wildcard copies don't fail on zero matches (e.g. a missing submodule), so check them
          if (-not (Get-ChildItem "$opti\libxess*.dll")) { Write-Error "No XeSS DLLs copied" }
          if (-not (Get-ChildItem "$agility\*.dll")) { Write-Error "No Agility SDK DLLs copied" }

      - name: Download and Bundle dlssg-to-fsr3 DLL
        id: fetch_dlssg
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"

          $downloadDir = Join-Path $env:GITHUB_WORKSPACE "dlssg-to-fsr3-download"
          New-Item -ItemType Directory -Path $downloadDir -Force | Out-Null

          Write-Output "Downloading latest release zip from optiscaler/dlssg-to-fsr3"
          gh release download --repo optiscaler/dlssg-to-fsr3 --pattern "*.zip" --dir $downloadDir --clobber
          if ($LASTEXITCODE -ne 0) { Write-Error "gh release download failed"; exit 1 }

          $zipFile = Get-ChildItem -Path $downloadDir -Filter "*.zip" | Select-Object -First 1
          if (-not $zipFile) {
              Write-Error "No zip asset found in the latest optiscaler/dlssg-to-fsr3 release."
              exit 1
          }
          Write-Output "Downloaded: $($zipFile.Name)"

          $extractPath = Join-Path $env:GITHUB_WORKSPACE "dlssg-to-fsr3-extracted"
          Expand-Archive -Path $zipFile.FullName -DestinationPath $extractPath -Force

          $dllName = "dlssg_to_fsr3_amd_is_better.dll"
          $dllFile = Get-ChildItem -Path $extractPath -Filter $dllName -Recurse | Select-Object -First 1
          if (-not $dllFile) {
              Write-Error "$dllName was not found inside $($zipFile.Name)"
              exit 1
          }

          # Same subfolder as the upscaler DLLs
          $destDir = Join-Path $env:GITHUB_WORKSPACE "x64\ReleaseDebug\a\OptiScaler"
          New-Item -ItemType Directory -Path $destDir -Force | Out-Null
          Copy-Item -Path $dllFile.FullName -Destination (Join-Path $destDir $dllName) -Force
          Write-Output "Copied $dllName to $destDir"

      - name: Compress Release Package
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $a = "${{ github.workspace }}\x64\ReleaseDebug\a"
          7z a "${{ github.workspace }}\${{ steps.get_version.outputs.filename }}.7z" "$a\*"
          if ($LASTEXITCODE -gt 1) { exit $LASTEXITCODE }
          exit 0

      - name: Generate Changelog
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NIGHTLY_REPO: ${{ github.repository }}
        run: |
          $head = (git rev-parse HEAD).Trim()
          $lastSha = $null

          # Find the SHA recorded in the previous nightly release
          $prevTag = gh release list --repo $env:NIGHTLY_REPO --exclude-drafts --limit 1 --json tagName --jq '.[0].tagName'
          if ($LASTEXITCODE -eq 0 -and $prevTag) {
            $prevBody = (gh release view $prevTag --repo $env:NIGHTLY_REPO --json body --jq '.body') -join "`n"
            $m = [regex]::Match($prevBody, '<!-- last-sha: ([0-9a-f]{40}) -->')
            if ($LASTEXITCODE -eq 0 -and $m.Success) {
              $candidate = $m.Groups[1].Value
              # Only use it if it still exists and is an ancestor of HEAD (guards against force-pushes)
              git cat-file -e "$candidate^{commit}" 2>$null
              if ($LASTEXITCODE -eq 0) {
                git merge-base --is-ancestor $candidate $head 2>$null
                if ($LASTEXITCODE -eq 0) { $lastSha = $candidate }
              }
            }
          }

          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8

          # 0x1e between commits, 0x1f between fields; %b may span several lines
          $rs = [string][char]0x1e
          $us = [string][char]0x1f
          $fmt = "%x1e%h%x1f%H%x1f%an%x1f%s%x1f%b"

          if ($lastSha) {
            $raw = (git log "$lastSha..$head" "--pretty=format:$fmt" --abbrev=8 --no-merges --first-parent) -join "`n"
            $heading = "### Changes Since the Last Nightly"
            $empty   = "No changes since the last nightly."
          } else {
            $raw = (git log --since="1 day ago" "--pretty=format:$fmt" --abbrev=8 --no-merges --first-parent) -join "`n"
            $heading = "### Changes in the Last 24 Hours"
            $empty   = "No changes in the last 24 hours."
          }

          $records = @($raw -split $rs | Where-Object { $_.Trim() })

          if ($records.Count -eq 0) {
            $releaseNotes = $empty
          } else {
            $formattedCommits = foreach ($rec in $records) {
              $f = $rec -split $us, 5
              $body = if ($f.Count -ge 5) { $f[4].Trim() } else { "" }
              $entry = "- [$($f[0].Trim())](https://github.com/${{ env.MAIN_REPO }}/commit/$($f[1])) $($f[3]) ($($f[2]))"
              if ($body) {
                $quoted = ($body -split "\r?\n" | ForEach-Object {
                  if ($_.Trim()) { "  > $($_.TrimEnd())" } else { "  >" }
                }) -join "  `n"
                $entry += "`n`n$quoted"
              }
              $entry
            }
            $releaseNotes = "$heading`n`n" + ($formattedCommits -join "`n")
          }

          # Hidden marker so the next run knows where to start
          $releaseNotes += "`n`n<!-- last-sha: $head -->"
          $releaseNotes | Out-File -FilePath release_notes.md -Encoding utf8

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.release_tag }}
          name: Nightly Build ${{ steps.get_version.outputs.release_tag }}
          body_path: release_notes.md
          files: ${{ github.workspace }}/${{ steps.get_version.outputs.filename }}.7z
          prerelease: true
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
